[package]
name = "talksphere"
version = "0.1.0"
edition = "2024"
publish = false
description = "A modular Rust server and proof of concept for the CR2SE protocol"
repository = "https://github.com/beothorn/TalkSphere"
readme = "README.md"

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
mio = { version = "1.2.4", default-features = false, features = ["net", "os-poll"] }
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = { version = "1.8.2", features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
